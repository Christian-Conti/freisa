repo: ../examples/lfsr_bank
top: lfsr_bank
rtl: ["*.sv"]
explore:
  place:
    - {dreamplace: {random_seed: 1000, global_place_stages: [{num_bins_x: 512, num_bins_y: 512, iteration: 300, learning_rate: 0.01, wirelength: weighted_average, optimizer: nesterov}]}}
    - {dreamplace: {random_seed: 7, global_place_stages: [{num_bins_x: 512, num_bins_y: 512, iteration: 300, learning_rate: 0.01, wirelength: weighted_average, optimizer: nesterov}]}}
  route:
    - {rwroute_args: [--nonTimingDriven, --outOfContext]}
    - {rwroute_args: [--nonTimingDriven, --outOfContext, --verbose]}
