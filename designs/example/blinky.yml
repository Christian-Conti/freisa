# Bundled example for every supported board: `make example TARGET=<board>`
repo: ../examples/blinky
top: blinky
rtl: ["*.v"]
synth_args: -flatten
# per-board overrides (merged over the keys above)
per_target:
  xc7z020: {xdc: [xc7z020.xdc]}                                           # fully open RTL -> .bit
  zcu104:  {top: blinky_diff, xdc: [zcu104.xdc], profile: vivado}         # pins + PL clock -> in-context, Vivado implements and writes the .bit
  zcu106:  {top: blinky_diff, xdc: [zcu106.xdc], profile: vivado}
  # kv260 has no PL clock oscillator (the PL clock comes from the PS): no pin file, open flow up to routed.dcp
