#
# Info     : Project file of X-HEEP (https://github.com/x-heep/x-heep), a RISC-V microcontroller, implemented with
#            open tools only. Prepare X-HEEP first (in its own env, see docs/7-examples.md): `make mcu-gen`, which
#            also writes the FuseSoC file list used here. Run: `make flow DESIGN=x-heep TARGET=zcu104 TO=route`.
# Module   : x-heep.yml
# Author   : Christian Conti
# Contact  : christian.conti@mail.it

# Sources: X-HEEP checkout next to FREISA (~/Desktop/x-heep), file list from FuseSoC (Verilator setup of mcu-gen).
repo: ../../x-heep
filelist: build/openhwgroup.org_systems_core-v-mini-mcu_1.0.6/sim-verilator/openhwgroup.org_systems_core-v-mini-mcu_1.0.6.vc
# top: the MCU without its pad ring (generic RTL: behavioral SRAM, no Vivado IP)
top: xilinx_core_v_mini_mcu_wrapper
# exclude: simulation-only files of the list (testbench, DPI models)
exclude: ["/tb/*", "*uartdpi*", "*SimJTAG*", "*jtag_dpi*", "*/bhv/*", "*_sim_*"]
synth_args: -flatten
slang_args: --compat vcs --allow-hierarchical-const --unroll-limit 1000000 --ignore-unknown-modules

# Clock gates are latches (always_latch), which the open placer cannot place: on FPGA they become feedthroughs
# (the gated blocks keep their clock running; X-HEEP's own FPGA flow maps them to BUFGCE instead).
patches:
  - {file: tc_clk.sv, from: "if (clk_i == 1'b0) clk_en <= en_i | test_en_i;", to: "clk_en = 1'b1;"}
  - {file: tc_clk.sv, from: "always_latch begin\n    clk_en = 1'b1;\n  end", to: "assign clk_en = 1'b1;"}
  - {file: cve2_clock_gate.sv, from: "if (clk_i == 1'b0) clk_en <= en_i | scan_cg_en_i;", to: "clk_en = 1'b1;"}
  - {file: cve2_clock_gate.sv, from: "always_latch begin\n    clk_en = 1'b1;\n  end", to: "assign clk_en = 1'b1;"}

# Tools: every step explores all the open tools that work on the board (all_open: no Vivado)
steps:
  synth: vivado
  netlist: vivado_link
  place: vivado
  route: vivado
  upload: openfpgaloader
