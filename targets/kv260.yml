part: xck26-sfvc784-2LV-c
family: xczu
yosys_family: xcup
needs_ps: true
carry: none        # DREAMPlaceFPGA has no CARRY8 node type; use `carry8` with a placer that does
legalize: dreamplace   # map BUFG/INV/LUT0 onto the placer's primitive library
board_store: [Xilinx/kv260_som, Xilinx/kv260_carrier]   # XilinxBoardStore path(s), pulled by `make install-boards`
