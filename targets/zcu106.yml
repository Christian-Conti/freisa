# Info     : Target board description.
# Module   : zcu106.yml
# Author   : Christian Conti
# Contact  : christian.conti@mail.it

part: xczu7ev-ffvc1156-2-e
family: xczu
yosys_family: xcup    # synth_xilinx has no zu+; xcup (UltraScale+ primitives) is the same fabric
has_ps: true          # Zynq PS present on the chip; only designs with a block design (`bd_tcl:`) use it
carry: none        # DREAMPlaceFPGA has no CARRY8 node type; use `carry8` with a placer that does
legalize: dreamplace   # map BUFG/INV/LUT0 onto the placer's primitive library
ofl_board: zcu106
board_store: Xilinx/zcu106   # XilinxBoardStore path(s), pulled by `make install-boards`
uart_channel: 3          # FT4232H interface of the PL UART (used by make uart-test)
